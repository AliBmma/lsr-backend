<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Details - Asiacell LSR Service</title>
  <!-- jsPDF library for PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 10px; /* Further reduced for A4 fit */
      background: #f8f9fa;
      min-height: 100vh;
    }

    .container {
      max-width: 794px; /* A4 width at 96dpi */
      margin: 0 auto;
      padding: 15px; /* Reduced padding for A4 fit */
      background: white;
      border-radius: 5px;
      box-shadow: none;
      overflow: hidden;
      border: 1px solid #e9ecef;
    }
    
    /* Additional styles for print optimization */
    @media print {
      body {
        margin: 0;
        padding: 5px;
        font-size: 11px;
      }
      .container {
        padding: 10px;
        max-width: none;
        border: none;
        border-radius: 0;
      }
      .button-group, .print-btn {
        display: none; /* Hide buttons in print */
      }
      .card {
        padding: 8px;
        margin-bottom: 10px;
        page-break-inside: avoid;
      }
      h3 {
        font-size: 14px;
        margin-bottom: 8px;
      }
      .info-grid {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 8px;
      }
      .info-item {
        padding: 6px;
      }
      .info-item strong {
        font-size: 10px;
      }
      .info-item p {
        font-size: 10px;
      }
      .description-area {
        padding: 8px;
      }
      .description-area strong {
        font-size: 11px;
      }
      .description-area p {
        font-size: 10px;
      }
      .machines-list {
        margin-top: 8px;
      }
      .machine-list-item {
        padding: 6px 8px;
      }
      .machine-info strong {
        font-size: 10px;
      }
      .machine-details {
        font-size: 9px;
      }
      .price-display {
        font-size: 9px;
      }
      .total-price {
        padding: 10px;
        font-size: 14px;
        margin-top: 15px;
      }
      .logistic-info {
        padding: 10px;
      }
      .logistic-info strong {
        font-size: 11px;
      }
      .logistic-info p {
        font-size: 10px;
      }
      .approval-item {
        padding: 4px;
        margin-bottom: 6px;
      }
      .approval-item strong {
        font-size: 10px;
      }
    }
    
    header { 
      background: white;
      color: #495057;
      padding: 20px; /* Reduced padding for A4 */
      text-align: center;
      border-radius: 5px 5px 0 0; /* Reduced border radius */
      border-bottom: 1px solid #e9ecef;
    }
    
    .logo { 
      font-size: 24px; /* Reduced font size for A4 */
      font-weight: bold; 
      color: #dc3545;
      margin-bottom: 8px; /* Reduced margin */
    }
    
    h2 {
      margin: 0;
      font-weight: 300;
      font-size: 20px; /* Adjusted font size for A4 */
    }
    
    .content {
      padding: 20px; /* Adjusted padding for A4 */
    }
    
    .card { 
      background: #ffffff; 
      padding: 15px; /* Adjusted padding for A4 */
      border-radius: 5px; /* Reduced border radius for print */
      margin-bottom: 15px; /* Adjusted margin for A4 */
      box-shadow: none; /* Removed shadow for print */
      border: 1px solid #e0e0e0; /* Simplified border */
    }
    
    .requests-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .request-item {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      border-left: 4px solid #28a745;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid #e9ecef;
    }
    
    .request-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(40, 167, 69, 0.2);
      border-color: #28a745;
    }
    
    .request-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #dee2e6;
    }
    
    .sr-number {
      font-weight: bold;
      color: #dc3545;
      font-size: 20px;
    }
    
    .request-date {
      color: #6c757d;
      font-size: 14px;
    }
    
    .request-details {
      margin-bottom: 15px;
    }
    
    .request-detail {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
    }
    
    .request-detail strong {
      color: #495057;
      min-width: 120px;
      font-size: 14px;
    }
    
    .request-detail span {
      color: #495057;
      font-size: 14px;
    }
    
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .status-completed {
      background: #d4edda;
      color: #155724;
    }

    .status-transit {
      background: #17a2b8;
      color: white;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }
    
    .empty-state h3 {
      color: #495057;
      margin-bottom: 10px;
    }
    
    .empty-state p {
      margin-bottom: 20px;
    }
    
    .back-btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .back-btn:hover {
      background: linear-gradient(135deg, #495057 0%, #343a40 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(108, 117, 125, 0.4);
    }
    
    .action-btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      margin-left: 10px;
    }
    
    .action-btn:hover {
      background: linear-gradient(135deg, #20c997 0%, #17a2b8 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
    }
    
    .print-btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      margin-left: 10px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    
    .print-btn:hover {
      background: linear-gradient(135deg, #c82333 0%, #a71e2a 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 53, 69, 0.4);
    }
    
    .button-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    
    h3 { 
      color: #495057;
      border-bottom: 3px solid #28a745; 
      padding-bottom: 10px; 
      margin-top: 0;
      font-size: 20px;
    }
    
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); /* Smaller grid for A4 */
      gap: 12px; /* Smaller gap */
      margin-top: 12px; /* Smaller margin */
    }
    
    .info-item {
      background: #f8f9fa;
      padding: 10px; /* Smaller padding */
      border-radius: 4px; /* Smaller border radius */
      border-left: 2px solid #dc3545; /* Thinner border */
    }
    
    .info-item strong {
      color: #495057;
      display: block;
      margin-bottom: 3px; /* Smaller margin */
      font-size: 12px; /* Smaller font size */
      text-transform: uppercase;
      letter-spacing: 0.2px; /* Smaller letter spacing */
    }
    
    .info-item p {
      margin: 0;
      color: #495057;
      font-size: 13px; /* Smaller font size */
      line-height: 1.3; /* Tighter line height */
    }
    
    .description-area {
      background: #f8f9fa;
      padding: 18px; /* Larger padding for service details */
      border-radius: 5px;
      border-left: 3px solid #dc3545;
      margin-top: 15px;
    }
    
    .description-area strong {
      color: #495057;
      display: block;
      margin-bottom: 10px; /* Larger margin */
      font-size: 14px; /* Larger font size */
      text-transform: uppercase;
      letter-spacing: 0.4px; /* More prominent */
      font-weight: 600; /* Bolder */
    }
    
    .description-area p {
      margin: 0;
      color: #2c3e50;
      font-size: 15px; /* Larger font size for service details */
      line-height: 1.6; /* Better readability */
      min-height: 50px; /* More space for details */
    }
    
    .machines-list {
      margin-top: 12px; /* Smaller margin */
      padding: 0;
      list-style: none;
    }
    
    .machine-list-item {
      background: #f8f9fa;
      padding: 10px 12px; /* Smaller padding */
      border-radius: 4px; /* Smaller border radius */
      border-left: 2px solid #28a745; /* Thinner border */
      margin-bottom: 8px; /* Space between list items */
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .machine-info {
      flex: 1;
    }
    
    .machine-info strong {
      color: #495057;
      display: block;
      margin-bottom: 2px; /* Smaller margin */
      font-size: 12px; /* Smaller font size */
    }
    
    .machine-details {
      display: flex;
      gap: 15px;
      font-size: 12px; /* Smaller font size */
      color: #6c757d;
    }
    
    .machine-price {
      text-align: right;
      min-width: 100px;
    }
    
    .price-display {
      font-weight: bold;
      color: #28a745;
      font-size: 12px; /* Smaller font size */
      display: block;
      margin-top: 2px; /* Smaller margin */
    }
    
    .total-price { 
      background: #28a745; /* Solid color instead of gradient */
      color: white;
      padding: 15px; /* Reduced padding for A4 */
      border-radius: 5px; /* Reduced border radius */
      margin-top: 20px; /* Reduced margin */
      text-align: center; 
      font-size: 18px; /* Adjusted font size */
      font-weight: bold;
      box-shadow: none; /* Removed shadow */
    }
    
    .logistic-info {
      background: #e8f5e8;
      padding: 15px; /* Reduced padding for A4 */
      border-radius: 5px; /* Reduced border radius */
      border-left: 3px solid #28a745; /* Thinner border */
      margin-top: 15px; /* Reduced margin */
    }
    
    .logistic-info strong {
      color: #155724;
      display: block;
      margin-bottom: 8px; /* Reduced margin */
      font-size: 13px; /* Adjusted font size */
      text-transform: uppercase;
      letter-spacing: 0.3px; /* Reduced letter spacing */
    }
    
    .logistic-info p {
      margin: 0;
      color: #155724;
      font-size: 14px; /* Adjusted font size */
      line-height: 1.4; /* Adjusted line height */
    }
    
    .section-title {
      color: #495057;
      border-bottom: 2px solid #28a745;
      padding-bottom: 8px; /* Reduced padding for A4 */
      margin-top: 20px; /* Adjusted margin for A4 */
      font-size: 16px; /* Adjusted font size for A4 */
    }

    .approval-item {
      margin-bottom: 10px;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 4px;
      border-left: 2px solid #28a745;
    }

    .approval-item strong {
      color: #495057;
    }
    
    @media (max-width: 768px) {
      body {
        padding: 20px;
      }
      
      .requests-grid {
        grid-template-columns: 1fr;
      }
      
      .content {
        padding: 20px;
      }
      
      .request-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Asiacell LSR Service</div>
      <h2>Service Request Details</h2>
    </header>

    <div class="content">
      <div id="requestDetails">
        <!-- Request details will be dynamically populated here -->
      </div>
      
      <div class="button-group">
        <button class="print-btn" onclick="generatePDF()">Print to PDF</button>
        <a href="completed-requests.html" class="back-btn">← Back to Completed Requests</a>
      </div>
    </div>
  </div>

  <script>
    // Machine prices
    const prices = {
      crane: 142000,
      worker: 25000,
      tadano: 250000
    };

    // Function to get machine display name
    function getMachineDisplayName(machineType) {
      const machineNames = {
        crane: 'Crane',
        worker: 'Worker',
        tadano: 'Tadano 25 ton'
      };
      return machineNames[machineType] || machineType;
    }

    // Function to render request details
    function renderRequestDetails() {
      const container = document.getElementById('requestDetails');

      // Get current request ID from URL or localStorage
      const urlParams = new URLSearchParams(window.location.search);
      const requestIdFromUrl = urlParams.get('requestId');
      let currentRequestId = requestIdFromUrl || localStorage.getItem('currentRequestId');

      // Update localStorage if from URL
      if (requestIdFromUrl) {
        localStorage.setItem('currentRequestId', requestIdFromUrl);
        currentRequestId = requestIdFromUrl;
      }

      // Debug logging
      console.log('Current Request ID:', currentRequestId);

      // Check all localStorage keys
      console.log('All localStorage keys:', Object.keys(localStorage));

      // Check if request ID exists
      if (!currentRequestId) {
        console.log('No currentRequestId found in localStorage');
        container.innerHTML = `
          <div style="text-align: center; padding: 40px; color: #dc3545;">
            <h3>No Request Selected</h3>
            <p>Please go back and select a request to view details.</p>
            <a href="completed-requests.html" class="back-btn">← Back to Completed Requests</a>
          </div>
        `;
        return;
      }

      // Get data from localStorage with error handling
      let requesterData = {};
      let machineData = {};
      let logisticData = {};

      try {
        const requestKey = `request_${currentRequestId}`;
        const machineKey = `machine_${currentRequestId}`;
        const logisticKey = `logistic_${currentRequestId}`;

        console.log('Looking for keys:', requestKey, machineKey, logisticKey);

        const requestData = localStorage.getItem(requestKey);
        const machineDataRaw = localStorage.getItem(machineKey);
        const logisticDataRaw = localStorage.getItem(logisticKey);

        console.log('Raw data found:', { requestData, machineDataRaw, logisticDataRaw });

        requesterData = requestData ? JSON.parse(requestData) : {};
        machineData = machineDataRaw ? JSON.parse(machineDataRaw) : {};
        logisticData = logisticDataRaw ? JSON.parse(logisticDataRaw) : {};

        // Debug: Check if logistic data has machines with basePrice
        if (logisticData.machines && logisticData.machines.length > 0) {
          console.log('Logistic machines found:', logisticData.machines.length);
          logisticData.machines.forEach((machine, index) => {
            console.log(`Machine ${index}:`, machine);
            console.log(`Machine ${index} basePrice:`, machine.basePrice);
            console.log(`Machine ${index} totalPrice:`, machine.totalPrice);
          });
        } else {
          console.log('No logistic machines found');
        }

      } catch (error) {
        console.error('Error parsing localStorage data:', error);
        container.innerHTML = `
          <div style="text-align: center; padding: 40px; color: #dc3545;">
            <h3>Data Error</h3>
            <p>Error reading data from localStorage: ${error.message}</p>
          </div>
        `;
        return;
      }

      // Debug logging
      console.log('Requester Data:', requesterData);
      console.log('Machine Data:', machineData);
      console.log('Logistic Data:', logisticData);

      // Check if we have any data at all
      if (!requesterData.srNumber && !machineData.machines && !logisticData.machines) {
        console.log('No standard data found, showing debug info');

        // Show debug information
        container.innerHTML = `
          <div style="text-align: left; padding: 20px; background: #f8f9fa; border: 1px solid #dee2e6; margin: 20px 0;">
            <h3>Debug Information</h3>
            <p><strong>Request ID:</strong> ${currentRequestId || 'Not found'}</p>
            <p><strong>Available localStorage keys:</strong></p>
            <ul>
              ${Object.keys(localStorage).map(key => `<li>${key}</li>`).join('')}
            </ul>
            <p><strong>Requester Data:</strong> ${JSON.stringify(requesterData, null, 2)}</p>
            <p><strong>Machine Data:</strong> ${JSON.stringify(machineData, null, 2)}</p>
            <p><strong>Logistic Data:</strong> ${JSON.stringify(logisticData, null, 2)}</p>
            <p>Please check the browser console for more detailed logs.</p>
            <a href="completed-requests.html" class="back-btn">← Back to Completed Requests</a>
          </div>
        `;
        return;
      }
      
      // Format dates
      const requestDate = requesterData.requestDate ? new Date(requesterData.requestDate).toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      }) : 'Not specified';
      
      const completeDate = machineData.completeWorkDate ? new Date(machineData.completeWorkDate).toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      }) : 'Not specified';
      
      // Calculate total price and determine which machine data to display
      let totalPrice = 0;
      let displayMachines = [];
      let displayCompleteDate = completeDate;

      // Prioritize logistic data for machines if available
      if (logisticData.machines && logisticData.machines.length > 0) {
        displayMachines = logisticData.machines;
        totalPrice = logisticData.totalPrice || 0;

        // Use logistic complete date if available
        if (logisticData.completeWorkDate) {
          displayCompleteDate = new Date(logisticData.completeWorkDate).toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });
        }
      } else if (machineData.machines && machineData.machines.length > 0) {
        displayMachines = machineData.machines;
        totalPrice = machineData.machines.reduce((sum, machine) => {
          const machinePrice = prices[machine.machine] || 0;
          return sum + (machinePrice * machine.count * machine.days);
        }, 0);
      }

      // Check if this is a transit request
      const isTransit = requesterData.isTransit;
      let transitLabel = '';
      if (isTransit) {
        transitLabel = ' <span class="status-badge status-transit">Transit</span>';
      }

      // Render the request details
      container.innerHTML = `
        <!-- Requester Information -->
        <div class="card">
          <h3>Requester Information${transitLabel}</h3>
          <div class="info-grid">
            <div class="info-item" style="grid-column: 1 / -1; text-align: center; background: #f0f8ff; border-left: 4px solid #dc3545; padding: 15px; margin-bottom: 20px;">
              <strong style="font-size: 18px; display: block; margin-bottom: 8px; color: #495057;">SR Number</strong>
              <p style="font-size: 32px; font-weight: bold; margin: 0; color: #dc3545; letter-spacing: 1px;">${requesterData.srNumber || 'Not specified'}</p>
            </div>
            <div class="info-item">
              <strong>Department</strong>
              <p>${requesterData.department || 'Not specified'}</p>
            </div>
            <div class="info-item">
              <strong>Requester Name</strong>
              <p>${requesterData.requesterName || 'Not specified'}</p>
            </div>
            <div class="info-item">
              <strong>Manager Name</strong>
              <p>${requesterData.chiefName || 'Not specified'}</p>
            </div>
            <div class="info-item">
              <strong>Warehouse Officer</strong>
              <p>${requesterData.warehouseOfficer || 'Not specified'}</p>
            </div>
            <div class="info-item">
              <strong>Request Date</strong>
              <p>${requestDate}</p>
            </div>
            <div class="info-item">
              <strong>Complete Work Date</strong>
              <p>${displayCompleteDate}</p>
            </div>
          </div>
          
          <div class="description-area">
            <strong>Service Details</strong>
            <p>${requesterData.details || 'No details provided'}</p>
          </div>
        </div>

        <!-- Machine Information -->
        <div class="card">
          <h3>Machine Information</h3>
          ${displayMachines.length > 0 ? `
            <table style="width: 100%; border-collapse: collapse; margin-top: 12px;">
              <thead>
                <tr style="background: #f8f9fa;">
                  <th style="border: 1px solid #dee2e6; padding: 8px; text-align: left; font-weight: bold;">Machine</th>
                  <th style="border: 1px solid #dee2e6; padding: 8px; text-align: center; font-weight: bold;">Count</th>
                  <th style="border: 1px solid #dee2e6; padding: 8px; text-align: center; font-weight: bold;">Days</th>
                  <th style="border: 1px solid #dee2e6; padding: 8px; text-align: center; font-weight: bold;">Location</th>
                  <th style="border: 1px solid #dee2e6; padding: 8px; text-align: center; font-weight: bold;">Work Type</th>
                  <th style="border: 1px solid #dee2e6; padding: 8px; text-align: center; font-weight: bold;">Daily Rate</th>
                  <th style="border: 1px solid #dee2e6; padding: 8px; text-align: center; font-weight: bold;">Total Price</th>
                </tr>
              </thead>
              <tbody>
                ${displayMachines.map(machine => {
                  // Debug logging for machine data
                  console.log('Processing machine:', machine);
                  console.log('Machine properties:', Object.keys(machine));
                  console.log('Machine basePrice:', machine.basePrice);
                  console.log('Machine totalPrice:', machine.totalPrice);

                  // Use the basePrice and totalPrice from logistic data if available
                  const machinePrice = machine.basePrice || (prices[machine.machine] || 0);
                  const totalMachinePrice = machine.totalPrice || (machinePrice * machine.count * machine.days);

                  console.log('Machine pricing - Base Price:', machinePrice, 'Total Price:', totalMachinePrice);
                  console.log('Using fallback pricing:', !machine.basePrice);

                  const totalPriceText = machine.multiplier > 1 ?
                    `Base: ${(totalMachinePrice / 1.3).toLocaleString()} IQD<br>Return: ${totalMachinePrice.toLocaleString()} IQD` :
                    `${totalMachinePrice ? totalMachinePrice.toLocaleString() : '0'} IQD`;

                  return `
                    <tr>
                      <td style="border: 1px solid #dee2e6; padding: 8px;">${getMachineDisplayName(machine.machine)}</td>
                      <td style="border: 1px solid #dee2e6; padding: 8px; text-align: center;">${machine.count}</td>
                      <td style="border: 1px solid #dee2e6; padding: 8px; text-align: center;">${machine.days}</td>
                      <td style="border: 1px solid #dee2e6; padding: 8px; text-align: center;">${machine.location || 'Not specified'}</td>
                      <td style="border: 1px solid #dee2e6; padding: 8px; text-align: center;">${machine.workType || 'Not specified'}</td>
                      <td style="border: 1px solid #dee2e6; padding: 8px; text-align: center;">${Math.round(machinePrice).toLocaleString()} IQD</td>
                      <td style="border: 1px solid #dee2e6; padding: 8px; text-align: center;">${totalPriceText}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>

            <div class="total-price">
              Total Machine Price: ${totalPrice ? totalPrice.toLocaleString() : '0'} IQD
            </div>
          ` : `
            <p style="color: #6c757d; text-align: center; padding: 20px;">
              No machine information available
            </p>
          `}
        </div>

        <!-- Logistic Information -->
        <div class="card">
          <h3>Logistic Information</h3>
          ${logisticData.logisticOfficer ? `
            <div class="logistic-info">
              <strong>Logistic Officer</strong>
              <p>${logisticData.logisticOfficer}</p>
            </div>

            ${(logisticData.logisticsOfficerNote || machineData.logisticsOfficerNote) ? `
              <div class="logistic-info" style="margin-top: 15px;">
                <strong>Logistic Officer Note</strong>
                <p>${logisticData.logisticsOfficerNote || machineData.logisticsOfficerNote}</p>
              </div>
            ` : ''}

            <div class="info-grid" style="margin-top: 20px;">
              <div class="info-item">
                <strong>Total Price</strong>
                <p>${logisticData.totalPrice ? logisticData.totalPrice.toLocaleString() + ' IQD' : (totalPrice ? totalPrice.toLocaleString() + ' IQD' : '0 IQD')}</p>
              </div>
              <div class="info-item">
                <strong>Status</strong>
                <p style="color: #28a745; font-weight: bold;">Completed</p>
              </div>
            </div>
          ` : `
            <p style="color: #6c757d; text-align: center; padding: 20px;">
              No logistic information available
            </p>
          `}
        </div>

        <!-- Approval Loop -->
        <div class="card">
          <h3>Approval Loop</h3>
          <div id="approvalLoop">
            <!-- Approval statuses will be populated here -->
          </div>
        </div>
      `;
    }

    // Function to generate PDF
    function generatePDF() {
      // Show loading state
      const printBtn = document.querySelector('.print-btn');
      const originalText = printBtn.textContent;
      printBtn.textContent = 'Generating PDF...';
      printBtn.disabled = true;
      
      // Use html2canvas to capture the content
      html2canvas(document.getElementById('requestDetails'), { scale: 2, useCORS: true, allowTaint: true }).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const jsPDF = window.jspdf.jsPDF;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgProps = pdf.getImageProperties(imgData);
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
        const pageHeight = pdf.internal.pageSize.getHeight() - 30; // Leave space for header

        // Add Asiacell Logistic Service logo at the top
        pdf.setFontSize(20);
        pdf.setFont(undefined, 'bold');
        pdf.setTextColor(220, 53, 69); // Red color matching the theme
        pdf.text('ASIACELL', pdfWidth / 2, 15, { align: 'center' });

        pdf.setFontSize(16);
        pdf.setFont(undefined, 'normal');
        pdf.setTextColor(73, 80, 87); // Dark gray color
        pdf.text('LOGISTIC SERVICE', pdfWidth / 2, 22, { align: 'center' });

        // Add a separator line
        pdf.setDrawColor(220, 53, 69); // Red color
        pdf.setLineWidth(0.5);
        pdf.line(20, 25, pdfWidth - 20, 25);

        // Scale the image to fit the page height if necessary
        let finalWidth = pdfWidth;
        let finalHeight = pdfHeight;
        if (pdfHeight > pageHeight) {
          const scale = pageHeight / pdfHeight;
          finalWidth = pdfWidth * scale;
          finalHeight = pageHeight;
        }

        // Center the image horizontally
        const xOffset = (pdfWidth - finalWidth) / 2;

        // Add image to PDF below the logo
        pdf.addImage(imgData, 'PNG', xOffset, 30, finalWidth, finalHeight);

        // Get current request ID and date for filename
        const currentRequestId = localStorage.getItem('currentRequestId');
        const requesterData = JSON.parse(localStorage.getItem(`request_${currentRequestId}`) || '{}');
        const timestamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        const filename = `Service_Request_${requesterData.srNumber || currentRequestId}_${timestamp}.pdf`;

        // Save the PDF
        pdf.save(filename);

        // Restore button state
        printBtn.textContent = originalText;
        printBtn.disabled = false;
      }).catch(error => {
        console.error('Error generating PDF:', error);
        alert('Error generating PDF. Please try again.');
        printBtn.textContent = originalText;
        printBtn.disabled = false;
      });
    }

    // Initialize the page
    document.addEventListener('DOMContentLoaded', function() {
      try {
        console.log('Page loaded, initializing...');
        renderRequestDetails();
        renderApprovalLoop();
      } catch (error) {
        console.error('Error initializing page:', error);
        document.getElementById('requestDetails').innerHTML = `
          <div style="text-align: center; padding: 40px; color: #dc3545;">
            <h3>JavaScript Error</h3>
            <p>There was an error loading the page: ${error.message}</p>
            <p>Please check the browser console for more details.</p>
          </div>
        `;
      }
    });

    // Function to get username for a specific role
    function getUsernameForRole(role) {
      // First check custom users added through diagnostic tool
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('user_')) {
          try {
            const userData = JSON.parse(localStorage.getItem(key));
            if (userData.role === role) {
              return userData.username;
            }
          } catch (e) {
            // Skip invalid user data
          }
        }
      }

      // Check default users
      const defaultUsers = {
        'requester': 'zaid.nihad',
        'request-viewer': 'laith.talib', // or mustafa.ismael, mustafa.munaf, abdulrahman.mazin, yasir.fri
        'supervisor': 'ali.basil',
        'logistic-control': 'sarbast.nadhmi',
        'admin': 'mahmood.saed',
        'chief': 'mohammed.radhwan',
        'store-keeper': 'haider.kareem'
      };

      return defaultUsers[role] || 'Unknown';
    }

    // Function to render approval loop
    function renderApprovalLoop() {
      const container = document.getElementById('approvalLoop');
      const currentRequestId = localStorage.getItem('currentRequestId');
      if (!currentRequestId) {
        container.innerHTML = '<p>No request selected to show approval loop.</p>';
        return;
      }

      const requestData = JSON.parse(localStorage.getItem(`request_${currentRequestId}`) || '{}');
      const machineData = JSON.parse(localStorage.getItem(`machine_${currentRequestId}`) || 'null');
      const logisticData = JSON.parse(localStorage.getItem(`logistic_${currentRequestId}`) || 'null');

      const approvals = [];

      // Helper function to get approval date
      function getApprovalDate(roleKey, status) {
        const dateKey = `${roleKey}_date_${currentRequestId}`;
        let storedDate = localStorage.getItem(dateKey);

        if (!storedDate && status === 'Approved') {
          // If no date stored but approved, store current date and use it
          storedDate = new Date().toISOString();
          localStorage.setItem(dateKey, storedDate);
        }

        if (storedDate) {
          return new Date(storedDate).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          });
        }

        return '';
      }

      // If the request is completed (has logistic data), set approvals based on request type
        if (logisticData && logisticData.logisticOfficer) {
          const isTransit = requestData.isTransit;
          const needsStoreKeeper = requestData.warehouseOfficerNeeded;

          const requesterDate = requestData.requestDate ? new Date(requestData.requestDate).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          }) : getApprovalDate('requester', 'Submitted');

          approvals.push({
            role: 'requester',
            status: 'Submitted',
            approver: requestData.requesterName,
            date: requesterDate
          });

          if (isTransit) {
            approvals.push({
              role: 'requester manager',
              status: 'Not Required',
              approver: '',
              date: ''
            });
            approvals.push({
              role: 'Logistic Supervisor',
              status: 'Approved',
              approver: getUsernameForRole('logistic-control'),
              date: getApprovalDate('logistic_supervisor', 'Approved')
            });
            approvals.push({
              role: 'Work Completion Approval (manager)',
              status: 'Not Required',
              approver: '',
              date: ''
            });
            approvals.push({
              role: 'W.H Approval',
              status: needsStoreKeeper ? 'Approved' : 'Not Required',
              approver: needsStoreKeeper ? (requestData.storeKeeperApprover || getUsernameForRole('store-keeper')) : '',
              date: needsStoreKeeper ? getApprovalDate('store_keeper', 'Approved') : ''
            });
            const logisticApprover = currentRequestId === 'SR-7479' ? getUsernameForRole('request-viewer') : (logisticData.logisticOfficer || 'request-viewer user');
            approvals.push({
              role: 'logistic officer',
              status: 'Approved',
              approver: logisticApprover,
              date: getApprovalDate('logistic_officer', 'Approved')
            });
        } else {
          approvals.push({
            role: 'requester manager',
            status: 'Approved',
            approver: requestData.chiefName,
            date: getApprovalDate('requester_manager', 'Approved')
          });
          approvals.push({
            role: 'Logistic Supervisor',
            status: 'Approved',
            approver: getUsernameForRole('logistic-control'),
            date: getApprovalDate('logistic_supervisor', 'Approved')
          });
          approvals.push({
            role: 'Work Completion Approval (manager)',
            status: 'Approved',
            approver: requestData.chiefName,
            date: getApprovalDate('work_completion', 'Approved')
          });
          approvals.push({
            role: 'W.H Approval',
            status: needsStoreKeeper ? 'Approved' : 'Not Required',
            approver: needsStoreKeeper ? (requestData.storeKeeperApprover || getUsernameForRole('store-keeper')) : '',
            date: needsStoreKeeper ? getApprovalDate('store_keeper', 'Approved') : ''
          });
          const logisticApprover = currentRequestId === 'SR-7479' ? getUsernameForRole('request-viewer') : (logisticData.logisticOfficer || 'request-viewer user');
          approvals.push({
            role: 'logistic officer',
            status: 'Approved',
            approver: logisticApprover,
            date: getApprovalDate('logistic_officer', 'Approved')
          });
        }
        } else {
          // Check individual approval statuses

          // Chief Approval
          const chiefApproved = localStorage.getItem(`approved_chief_approval_${currentRequestId}`);
          const chiefRejected = localStorage.getItem(`rejected_chief_approval_${currentRequestId}`);
          const chiefPending = localStorage.getItem(`pending_chief_approval_${currentRequestId}`);

          let chiefStatus = 'Not Started';
          let chiefApprover = '';
          let chiefDate = '';

          if (chiefApproved) {
            chiefStatus = 'Approved';
            chiefApprover = requestData.chiefName || '';
            chiefDate = getApprovalDate('requester_manager', 'Approved');
          } else if (chiefRejected) {
            chiefStatus = 'Rejected';
            chiefDate = getApprovalDate('requester_manager', 'Rejected');
          } else if (chiefPending) {
            chiefStatus = 'Pending';
          }

          approvals.push({
            role: 'requester manager',
            status: chiefStatus,
            approver: chiefApprover,
            date: chiefDate
          });

          // Logistic Supervisor
          let supervisorStatus = 'Not Started';
          let supervisorApprover = '';
          let supervisorDate = '';

          if (machineData && (machineData.status === 'work_approved' || machineData.status === 'completion_approved')) {
            supervisorStatus = 'Approved';
            supervisorApprover = 'Logistic Control';
            supervisorDate = getApprovalDate('logistic_supervisor', 'Approved');
          }

          approvals.push({
            role: 'Logistic Supervisor',
            status: supervisorStatus,
            approver: supervisorApprover,
            date: supervisorDate
          });

        // Work Completion Approval (manager)
        const completionApproved = localStorage.getItem(`approved_chief_completion_approval_${currentRequestId}`);
        const completionRejected = localStorage.getItem(`rejected_chief_completion_approval_${currentRequestId}`);
        const completionPending = localStorage.getItem(`pending_chief_completion_approval_${currentRequestId}`);

        let completionStatus = 'Not Started';
        let completionApprover = '';
        let completionDate = '';

        if (completionApproved) {
          completionStatus = 'Approved';
          completionApprover = requestData.chiefName || '';
          completionDate = getApprovalDate('work_completion', 'Approved');
        } else if (completionRejected) {
          completionStatus = 'Rejected';
          completionDate = getApprovalDate('work_completion', 'Rejected');
        } else if (completionPending) {
          completionStatus = 'Pending';
        }

        approvals.push({
          role: 'Work Completion Approval (manager)',
          status: completionStatus,
          approver: completionApprover,
          date: completionDate
        });

        // Store Keeper Approval
        const storeKeeperPending = localStorage.getItem(`pending_store_keeper_approval_${currentRequestId}`);
        const storeKeeperApproved = localStorage.getItem(`approved_store_keeper_approval_${currentRequestId}`);

        let storeKeeperStatus = 'Not Started';
        let storeKeeperApprover = '';
        let storeKeeperDate = '';

        if (storeKeeperApproved) {
          storeKeeperStatus = 'Approved';
          storeKeeperApprover = requestData.storeKeeperApprover || requestData.warehouseOfficer || 'Store Keeper';
          storeKeeperDate = getApprovalDate('store_keeper', 'Approved');
        } else if (storeKeeperPending) {
          storeKeeperStatus = 'Pending';
        }

          approvals.push({
            role: 'W.H Approval',
            status: storeKeeperStatus,
            approver: storeKeeperStatus === 'Approved' ? (requestData.storeKeeperApprover || getUsernameForRole('store-keeper')) : storeKeeperApprover,
            date: storeKeeperDate
          });

        // Logistic Approval
        let logisticStatus = 'Not Started';
        let logisticApprover = '';
        let logisticDate = '';

        if (logisticData && logisticData.logisticOfficer) {
          logisticStatus = 'Approved';
          logisticApprover = logisticData.logisticOfficer;
          logisticDate = getApprovalDate('logistic_officer', 'Approved');
        }

        approvals.push({
          role: 'logistic officer',
          status: logisticStatus,
          approver: logisticApprover,
          date: logisticDate
        });
      }

      // Get logistic officer name
      const logisticOfficer = localStorage.getItem('username') || 'ali.basil';

      // Render approvals
      const approvalHTML = `
        <table style="width: 100%; border-collapse: collapse; margin-top: 12px;">
          <thead>
            <tr style="background: #f8f9fa;">
              <th style="border: 1px solid #dee2e6; padding: 8px; text-align: left; font-weight: bold;">Role</th>
              <th style="border: 1px solid #dee2e6; padding: 8px; text-align: center; font-weight: bold;">Status</th>
              <th style="border: 1px solid #dee2e6; padding: 8px; text-align: center; font-weight: bold;">Approver</th>
              <th style="border: 1px solid #dee2e6; padding: 8px; text-align: center; font-weight: bold;">Date</th>
            </tr>
          </thead>
          <tbody>
            ${approvals.map(approval => {
              let color = '#6c757d'; // default gray
              if (approval.status === 'Approved') color = '#28a745';
              else if (approval.status === 'Rejected') color = '#dc3545';
              else if (approval.status === 'Pending') color = '#ffc107';

              return `
                <tr>
                  <td style="border: 1px solid #dee2e6; padding: 8px;">${approval.role}</td>
                  <td style="border: 1px solid #dee2e6; padding: 8px; text-align: center; color: ${color}; font-weight: 600;">${approval.status}</td>
                  <td style="border: 1px solid #dee2e6; padding: 8px; text-align: center;">${approval.approver || ''}</td>
                  <td style="border: 1px solid #dee2e6; padding: 8px; text-align: center;">${approval.date || ''}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;

      // Add logistic officer name at the end
      const logisticFooter = `
        <div style="margin-top: 15px; padding: 10px; background: #e8f5e8; border-radius: 4px; border-left: 3px solid #28a745; text-align: center; font-weight: bold; color: #155724;">
          logistic control : ${logisticOfficer}
        </div>
      `;

      container.innerHTML = approvalHTML + logisticFooter;
    }
  </script>
</body>
