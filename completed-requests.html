<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Completed Requests - Asiacell - SCM -LSR </title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- jsPDF library for PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      margin: 0; 
      padding: 40px; 
      background: #ffffff; /* Changed to white */
      min-height: 100vh;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
      border: 1px solid #e9ecef
    }
    
    header { 
      background: white;
      color: #495057;
      padding: 30px;
      text-align: center;
      border-radius: 10px 10px 0 0;
      border-bottom: 1px solid #e9ecef;
    }
    
    .logo { 
      font-size: 28px; 
      font-weight: bold; 
      color: #dc3545;
      margin-bottom: 10px;
    }
    
    h2 {
      margin: 0;
      font-weight: 300;
      font-size: 22px;
    }
    
    .content {
      padding: 30px;
    }
    
    .card { 
      background: #ffffff; /* Changed to white */
      padding: 25px; 
      border-radius: 15px; 
      margin-bottom: 30px; 
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      border: 1px solid #dc3545; /* Changed border to red */
    }
    
    .requests-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .request-item {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      border-left: 4px solid #dc3545;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid #dc3545;
      position: relative;
    }

    .request-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 53, 69, 0.2);
      border-color: #dc3545;
    }

    .request-item.selected {
      background: #f8d7da;
      border-color: #dc3545;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
    }

    .request-item.selected:hover {
      border-color: #c82333;
      box-shadow: 0 6px 20px rgba(220, 53, 69, 0.4);
    }

    .request-checkbox {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 20px;
      height: 20px;
      cursor: pointer;
      z-index: 10;
    }

    .request-item.with-checkbox {
      padding-right: 50px;
    }
    
    .request-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #dc3545;
    }
    
    .sr-number {
      font-weight: bold;
      color: #dc3545;
      font-size: 16px;
    }
    
    .request-date {
      color: #000000;
      font-size: 14px;
    }
    
    .request-details {
      margin-bottom: 15px;
    }
    
    .request-detail {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
    }
    
    .request-detail strong {
      color: #000000;
      min-width: 120px;
      font-size: 14px;
    }
    
    .request-detail span {
      color: #000000;
      font-size: 14px;
    }
    
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .status-completed {
      background: #dc3545;
      color: white;
    }

    .status-transit {
      background: #17a2b8;
      color: white;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #000000;
    }
    
    .empty-state h3 {
      color: #000000;
      margin-bottom: 10px;
    }
    
    .empty-state p {
      margin-bottom: 20px;
      color: #000000;
    }
    
    .back-btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #000000 0%, #333333 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .back-btn:hover {
      background: linear-gradient(135deg, #333333 0%, #666666 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .pending-btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      margin-top: 15px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
    }
    
    .pending-btn:hover {
      background: linear-gradient(135deg, #c82333 0%, #a71e2a 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 53, 69, 0.4);
    }

    .action-btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      margin-left: 10px;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
    }
    
    .action-btn:hover {
      background: linear-gradient(135deg, #c82333 0%, #a71e2a 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 53, 69, 0.4);
    }
    
    h3 { 
      color: #000000;
      border-bottom: 3px solid #dc3545; 
      padding-bottom: 10px; 
      margin-top: 0;
      font-size: 20px;
    }
    
    /* Additional styles for print optimization */
    @media print {
      body {
        margin: 0;
        padding: 5px;
        font-size: 11px;
      }
      .container {
        padding: 10px;
        max-width: none;
        border: none;
        border-radius: 0;
      }
      .button-group, .print-btn {
        display: none; /* Hide buttons in print */
      }
      .card {
        padding: 8px;
        margin-bottom: 10px;
        page-break-inside: avoid;
      }
      h3 {
        font-size: 14px;
        margin-bottom: 8px;
      }
      .info-grid {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 8px;
      }
      .info-item {
        padding: 6px;
      }
      .info-item strong {
        font-size: 10px;
      }
      .info-item p {
        font-size: 10px;
      }
      .description-area {
        padding: 8px;
      }
      .description-area strong {
        font-size: 11px;
      }
      .description-area p {
        font-size: 10px;
      }
      .machines-list {
        margin-top: 8px;
      }
      .machine-list-item {
        padding: 6px 8px;
      }
      .machine-info strong {
        font-size: 10px;
      }
      .machine-details {
        font-size: 9px;
      }
      .price-display {
        font-size: 9px;
      }
      .total-price {
        padding: 10px;
        font-size: 14px;
        margin-top: 15px;
      }
      .logistic-info {
        padding: 10px;
      }
      .logistic-info strong {
        font-size: 11px;
      }
      .logistic-info p {
        font-size: 10px;
      }
      .approval-item {
        padding: 4px;
        margin-bottom: 6px;
      }
      .approval-item strong {
        font-size: 10px;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 20px;
      }

      .requests-grid {
        grid-template-columns: 1fr;
      }

      .content {
        padding: 20px;
      }

      .request-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Asiacell - SCM -LSR </div>
      <h2>Completed Service Requests</h2>
    </header>

    <div class="content">
    <div class="card">
      <h3>Completed Requests</h3>
      <div style="margin-bottom: 20px;">
        <input type="text" id="searchInput" placeholder="Search by SR Number..." style="width: 100%; padding: 12px; border: 2px solid #dee2e6; border-radius: 6px; font-size: 14px;">
      </div>
      <div style="margin-bottom: 20px; text-align: center;">
        <button id="selectAllBtn" class="action-btn" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%); margin-right: 10px;">Select All</button>
        <button id="clearSelectionBtn" class="action-btn" style="background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%); margin-right: 10px;">Clear Selection</button>
        <button id="exportSelectedBtn" class="action-btn" style="background: linear-gradient(135deg, #17a2b8 0%, #138496 100%); margin-right: 10px;">📊 Export Selected</button>
        <button id="exportBtn" class="action-btn">📊 Export All</button>
        <button id="printAllBtn" class="action-btn" style="background: linear-gradient(135deg, #dc3545 0%, #c82333 100%); margin-left: 10px;">🖨️ Print All to PDF</button>
      </div>
      <div id="completedRequestsList" class="requests-grid">
        <!-- Completed requests will be dynamically populated here -->
      </div>
    </div>
    </div>
  </div>

  <script>
    // Global variables for request selection
    let selectedRequests = new Set();

    // Function to toggle request selection
    function toggleRequestSelection(requestId, checkbox, event) {
      event.stopPropagation(); // Prevent triggering the card click event

      if (checkbox.checked) {
        selectedRequests.add(requestId);
      } else {
        selectedRequests.delete(requestId);
      }

      // Update the request item visual state
      const requestItem = checkbox.closest('.request-item');
      if (checkbox.checked) {
        requestItem.classList.add('selected');
      } else {
        requestItem.classList.remove('selected');
      }

      // Update button states
      updateSelectionButtons();
    }

    // Function to select all requests
    function selectAllRequests() {
      const checkboxes = document.querySelectorAll('.request-checkbox');
      checkboxes.forEach(checkbox => {
        checkbox.checked = true;
        const requestId = checkbox.dataset.requestId;
        selectedRequests.add(requestId);
        checkbox.closest('.request-item').classList.add('selected');
      });
      updateSelectionButtons();
    }

    // Function to clear all selections
    function clearAllSelections() {
      const checkboxes = document.querySelectorAll('.request-checkbox');
      checkboxes.forEach(checkbox => {
        checkbox.checked = false;
        const requestId = checkbox.dataset.requestId;
        selectedRequests.delete(requestId);
        checkbox.closest('.request-item').classList.remove('selected');
      });
      updateSelectionButtons();
    }

    // Function to update selection button states
    function updateSelectionButtons() {
      const selectAllBtn = document.getElementById('selectAllBtn');
      const clearSelectionBtn = document.getElementById('clearSelectionBtn');
      const exportSelectedBtn = document.getElementById('exportSelectedBtn');

      const totalRequests = document.querySelectorAll('.request-item').length - 1; // Subtract 1 for summary card
      const selectedCount = selectedRequests.size;

      if (selectedCount === 0) {
        selectAllBtn.textContent = 'Select All';
        clearSelectionBtn.style.display = 'none';
        exportSelectedBtn.style.display = 'none';
      } else {
        selectAllBtn.textContent = `Select All (${selectedCount}/${totalRequests})`;
        clearSelectionBtn.style.display = 'inline-block';
        exportSelectedBtn.style.display = 'inline-block';
        exportSelectedBtn.textContent = `📊 Export Selected (${selectedCount})`;
      }
    }

    // Function to get all completed requests
    function getCompletedRequests() {
      const completedRequests = [];
      
      // Check localStorage for stored requests
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('request_')) {
          try {
            const requestData = JSON.parse(localStorage.getItem(key));
            const requestId = key.replace('request_', '');
            
            // Check if this request has logistic data (completed)
            const logisticDataStr = localStorage.getItem(`logistic_${requestId}`);
            if (logisticDataStr) {
              try {
                const logisticData = JSON.parse(logisticDataStr);
                // Only include if not sent-back
                if (logisticData.status !== 'sent-back-logistic') {
                  completedRequests.push({
                    id: requestId,
                    ...requestData,
                    logisticData: logisticData
                  });
                }
              } catch (e) {
                console.error('Error parsing logistic data:', e);
              }
            }
          } catch (e) {
            console.error('Error parsing request data:', e);
          }
        }
      }
      
      return completedRequests.sort((a, b) => new Date(b.requestDate || 0) - new Date(a.requestDate || 0));
    }

    // Function to calculate total price for all completed requests
    function calculateTotalPrice(completedRequests) {
      return completedRequests.reduce((total, request) => {
        return total + (request.logisticData.totalPrice || 0);
      }, 0);
    }

    // Function to render completed requests as a comprehensive list
    function renderCompletedRequests(searchTerm = '') {
      const allCompletedRequests = getCompletedRequests();

      // Filter requests by search term
      const completedRequests = allCompletedRequests.filter(request => {
        const srNumber = (request.srNumber || '').toLowerCase();
        return !searchTerm || srNumber.includes(searchTerm);
      });

      const container = document.getElementById('completedRequestsList');
      const totalPrice = calculateTotalPrice(completedRequests);

      // Reset selection state when re-rendering
      selectedRequests.clear();
      updateSelectionButtons();
      
      if (completedRequests.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No Completed Requests Found</h3>
            <p>There are no completed service requests yet.</p>
            <a href="requests.html" class="back-btn">View All Requests</a>
            <div style="margin-top: 15px;">
              <a href="request-viewer.html" class="back-btn">← Back to Request Viewer</a>
            </div>
          </div>
        `;
        return;
      }
      
      container.innerHTML = completedRequests.map(request => {
        const requestDate = request.requestDate ? new Date(request.requestDate).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }) : 'Not specified';
        
        const completeDate = request.logisticData.completeWorkDate ? new Date(request.logisticData.completeWorkDate).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        }) : 'Not specified';
        
        const isTransit = request.isTransit;
        const transitLabel = isTransit ? `<span class="status-badge status-transit">Transit</span>` : '';
        
        return `
          <div class="request-item with-checkbox">
            <input type="checkbox" class="request-checkbox" data-request-id="${request.id}" onchange="toggleRequestSelection('${request.id}', this, event)">
            <div class="request-header">
              <div class="sr-number">${request.srNumber || 'SR-N/A'}</div>
              <div style="display: flex; align-items: center; gap: 10px;">
                <div class="status-badge status-completed">Completed</div>
                ${transitLabel}
              </div>
            </div>
            
            <div class="request-details">
              <div class="request-detail">
                <strong>Department:</strong>
                <span>${request.department || 'Not specified'}</span>
              </div>
              
              <div class="request-detail">
                <strong>Requester:</strong>
                <span>${request.requesterName || 'Not specified'}</span>
              </div>
              
              <div class="request-detail">
                <strong>Manager:</strong>
                <span>${request.chiefName || 'Not specified'}</span>
              </div>
              
              <div class="request-detail">
                <strong>Request Date:</strong>
                <span>${requestDate}</span>
              </div>
              
              <div class="request-detail">
                <strong>Completed Date:</strong>
                <span>${completeDate}</span>
              </div>
              
              <div class="request-detail">
                <strong>Total Price:</strong>
                <span>
                  ${request.logisticData && request.logisticData.machines && request.logisticData.machines.some(m => m.multiplier > 1) ?
                    `Base Price: ${(request.logisticData.totalPrice / 1.3).toLocaleString()} IQD, Return Price: ${request.logisticData.totalPrice.toLocaleString()} IQD` :
                    `${request.logisticData && request.logisticData.totalPrice !== undefined ? request.logisticData.totalPrice.toLocaleString() + ' IQD' : 'Not specified'}`
                  }
                </span>
              </div>
              
      <div class="request-detail">
        <strong>Logistic Officer:</strong>
        <span>${request.logisticData.logisticOfficer || 'Not specified'}</span>
      </div>
      ${(request.logisticData.logisticsOfficerNote) ? `
      <div class="request-detail">
        <strong>Logistic Officer Note:</strong>
        <span>${request.logisticData.logisticsOfficerNote}</span>
      </div>
      ` : ''}
    </div>
    
    <div class="request-date">
      Use the View Details button to see logistics information
    </div>
    
    <div style="text-align: center; margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
      <button class="pending-btn" onclick="viewCompletedRequest('${request.id}')">
        View Details
      </button>
      <button class="pending-btn" onclick="markAsPending('${request.id}', event)" style="background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%);">
        Mark as In-Progress
      </button>
    </div>
  </div>
        `;
      }).join('');
      
      // Add total price summary
      container.innerHTML += `
        <div style="grid-column: 1 / -1; text-align: center; margin-top: 30px; padding: 20px; background: linear-gradient(135deg, #dc3545 0%, #c82333 100%); border-radius: 10px; color: white;">
          <h3 style="margin: 0 0 10px 0; color: white; border-bottom: 2px solid rgba(255,255,255,0.3); padding-bottom: 10px;">
            Total Summary
          </h3>
          <div style="font-size: 18px; margin-bottom: 5px;">
            <strong>Total Completed Requests:</strong> ${completedRequests.length}
          </div>
          <div style="font-size: 24px; font-weight: bold;">
            <strong>Grand Total Price:</strong> ${totalPrice.toLocaleString()} IQD
          </div>
        </div>
      `;
      
      // Add navigation buttons
      container.innerHTML += `
        <div style="grid-column: 1 / -1; text-align: center; margin-top: 30px;">
          <a href="request-viewer.html" class="back-btn" style="margin: 0 10px;">← Back to Request Viewer</a>
          <a href="in-progress-requests.html" class="action-btn" style="margin: 0 10px;">View In-Progress Requests →</a>
          <a href="requests.html" class="action-btn" style="margin: 0 10px; display:none;">View All Requests →</a>
        </div>
      `;
    }

    // Function to view a completed request (navigate to final results)
    function viewCompletedRequest(requestId) {
      // Load the stored request data and logistic data
      const requestData = JSON.parse(localStorage.getItem(`request_${requestId}`));
      const logisticData = JSON.parse(localStorage.getItem(`logistic_${requestId}`));
      
      // Store the current request data for the final page
      localStorage.setItem('currentRequestId', requestId);
      localStorage.setItem('requesterData', JSON.stringify(requestData));
      localStorage.setItem('logisticData', JSON.stringify(logisticData));
      
      // Navigate to final results page
      window.location.href = 'final.html';
    }

    // Function to mark a completed request as pending (remove logistic data)
    function markAsPending(requestId, event) {
      event.stopPropagation(); // Prevent triggering the card click event

      if (confirm('Are you sure you want to mark this request as pending? This will remove the logistic data and move it back to in-progress status.')) {
        // Remove logistic data from localStorage
        localStorage.removeItem(`logistic_${requestId}`);

        // Show success message
        alert('Request has been marked as pending and moved to in-progress requests!');

        // Redirect to in-progress requests page
        window.location.href = 'in-progress-requests.html';
      }
    }

    // Function to export completed requests to Excel
    async function exportToExcel() {
      const completedRequests = getCompletedRequests();

      if (completedRequests.length === 0) {
        alert('No completed requests to export.');
        return;
      }

      // Load Excel data for pricing
      let excelData = [];
      try {
        const response = await fetch('database.xlsx');
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
        excelData = jsonData.slice(1).filter(row => row.length >= 4);
        console.log('Excel data loaded for export:', excelData.length, 'rows');
      } catch (error) {
        console.error('Error loading Excel file:', error);
        alert('Error loading pricing data from database.xlsx');
        return;
      }

      // Prepare data for Excel - flatten machines into separate rows
      const data = [];
      let grandTotal = 0;

      completedRequests.forEach(request => {
        const requestTotal = { machines: 0, totalPrice: 0 };
        const machines = request.logisticData.machines || [];

        console.log('DEBUG: Processing request:', request.srNumber);
        console.log('DEBUG: Machines data:', machines);

        if (machines && machines.length > 0) {
          machines.forEach((machine, index) => {
            console.log('DEBUG: Processing machine:', machine);

            // Ensure machine data has the correct structure
            const machineType = machine.machine || machine.type || 'unknown';
            const machineCount = parseInt(machine.count || machine.quantity || 1);
            const machineDays = parseInt(machine.days || machine.duration || 1);

            // Calculate price based on machine, location, and work type combination from Excel data
            let unitPrice = 0;
            if (machine.machine && machine.location && machine.workType) {
              const matchingRow = excelData.find(row =>
                row[0] && row[0].toString().trim() === machine.machine &&
                row[1] && row[1].toString().trim() === machine.location &&
                row[2] && row[2].toString().trim() === machine.workType &&
                row[3]
              );
              if (matchingRow && matchingRow[3]) {
                unitPrice = parseInt(matchingRow[3].toString().replace(/[,‏]/g, '')) || 0;
                console.log('Found matching row for:', machine.machine, machine.location, machine.workType, 'Price:', unitPrice);
              } else {
                console.log('No matching row found for:', machine.machine, machine.location, machine.workType);
              }
            } else {
              console.log('Missing data for machine:', machine.machine, 'location:', machine.location, 'workType:', machine.workType);
            }

            const multiplier = machine.multiplier || 1;
            const baseMachineTotal = unitPrice * machineDays * machineCount;
            const machineTotal = baseMachineTotal * multiplier;

            console.log('DEBUG: Machine details:', {
              originalMachine: machine,
              type: machineType,
              count: machineCount,
              days: machineDays,
              unitPrice: unitPrice,
              multiplier: multiplier,
              baseTotal: baseMachineTotal,
              total: machineTotal,
              availableExcelData: excelData.length
            });

            requestTotal.totalPrice += machineTotal;
            requestTotal.machines += 1;

            const rowData = {
              'SR Number': request.srNumber || 'N/A',
              'Department': request.department || 'N/A',
              'Requester': request.requesterName || 'N/A',
              'Manager': request.chiefName || 'N/A',
              'Request Date': request.requestDate ? new Date(request.requestDate).toLocaleDateString('en-US') : 'N/A',
              'Completed Date': request.logisticData.completeWorkDate ? new Date(request.logisticData.completeWorkDate).toLocaleDateString('en-US') : 'N/A',
              'Logistic Officer': request.logisticData.logisticOfficer || 'N/A',
              'Transit': request.isTransit ? 'Yes' : 'No',
              'Machine': machineType,
              'Location': machine.location || 'N/A',
              'Work Type': machine.workType || 'N/A',
              'Number': machineCount,
              'Days': machineDays,
              'Unit Price (IQD)': unitPrice,
              'Base Total (IQD)': baseMachineTotal,
              'Total Price (IQD)': machineTotal
            };

            // Add 30% indicator if multiplier > 1
            if (multiplier > 1) {
              rowData['30% Applied'] = 'Yes';
            }
            rowData['30% Price (IQD)'] = multiplier > 1 ? baseMachineTotal * 0.3 : 0;

            data.push(rowData);
          });
        } else {
          // If no machines, add a row without machine details
          console.log('DEBUG: No machines found for request:', request.srNumber);
          data.push({
            'SR Number': request.srNumber || 'N/A',
            'Department': request.department || 'N/A',
            'Requester': request.requesterName || 'N/A',
            'Manager': request.chiefName || 'N/A',
            'Request Date': request.requestDate ? new Date(request.requestDate).toLocaleDateString('en-US') : 'N/A',
            'Completed Date': request.logisticData.completeWorkDate ? new Date(request.logisticData.completeWorkDate).toLocaleDateString('en-US') : 'N/A',
            'Logistic Officer': request.logisticData.logisticOfficer || 'N/A',
            'Transit': request.isTransit ? 'Yes' : 'No',
            'Machine': 'No machines',
            'Location': 'N/A',
            'Work Type': 'N/A',
            'Number': 0,
            'Days': 0,
            'Unit Price (IQD)': 0,
            'Base Total (IQD)': 0,
            'Total Price (IQD)': 0
          });
        }

        grandTotal += requestTotal.totalPrice;
      });

      // Sort data by SR Number for merging
      data.sort((a, b) => (a['SR Number'] || '').localeCompare(b['SR Number'] || ''));

      // Create worksheet
      const ws = XLSX.utils.json_to_sheet(data);

      // Add merges for SR Number column where consecutive rows have the same SR
      const merges = [];
      let startRow = 1; // Start from row 1 (0-indexed, but Excel rows start at 1, header is 0)
      for (let i = 1; i < data.length; i++) {
        if (data[i]['SR Number'] !== data[i - 1]['SR Number']) {
          if (startRow < i) {
            merges.push({ s: { r: startRow, c: 0 }, e: { r: i, c: 0 } }); // Merge column A (0) from startRow to i
          }
          startRow = i + 1;
        }
      }
      // Last group
      if (startRow < data.length) {
        merges.push({ s: { r: startRow, c: 0 }, e: { r: data.length, c: 0 } });
      }

      ws['!merges'] = merges;

      // Create summary data for machine counts and pricing
      const machineSummary = {};
      data.forEach(row => {
        const machine = row['Machine'];
        const location = row['Location'];
        const workType = row['Work Type'];
        const count = row['Number'] || 0;
        const days = row['Days'] || 0;
        const unitPrice = row['Unit Price (IQD)'] || 0;
        const baseTotal = row['Base Total (IQD)'] || 0;
        const totalPrice = row['Total Price (IQD)'] || 0;
        const thirtyPercentPrice = row['30% Price (IQD)'] || 0;

        if (machine && machine !== 'No machines') {
          const key = `${machine}|${location}|${workType}`;
          if (!machineSummary[key]) {
            machineSummary[key] = {
              totalCount: 0,
              unitPrice: unitPrice,
              baseTotalPrice: 0,
              totalPrice: 0,
              total30Percent: 0
            };
          }
          // total number is number * days
          machineSummary[key].totalCount += count * days;
          machineSummary[key].baseTotalPrice += baseTotal;
          machineSummary[key].totalPrice += totalPrice;
          machineSummary[key].total30Percent += thirtyPercentPrice;
        }
      });

      const summaryData = Object.keys(machineSummary).map(key => {
        const [machine, location, workType] = key.split('|');
        const summary = machineSummary[key];
        return {
          'Machine': machine,
          'Location': location,
          'Work Type': workType,
          'Unit Price (IQD)': summary.unitPrice,
          'Total Number': summary.totalCount,
          'Base Total Price (IQD)': summary.baseTotalPrice,
          'Total Price (IQD)': summary.totalPrice,
          '30% Price (IQD)': summary.total30Percent
        };
      });

      // Create summary worksheet
      const wsSummary = XLSX.utils.json_to_sheet(summaryData);

      // Create Sheet3: Comparison with database.xlsx
      const sheet3Data = [];
      summaryData.forEach(item => {
        const machine = item['Machine'];
        const location = item['Location'];
        const workType = item['Work Type'];
        const matchingDbRow = excelData.find(row =>
          row[0] && row[0].toString().trim() === machine &&
          row[1] && row[1].toString().trim() === location &&
          row[2] && row[2].toString().trim() === workType
        );
        if (matchingDbRow && matchingDbRow.length > 4) {
          sheet3Data.push({
            'des': matchingDbRow[4] ? matchingDbRow[4].toString().replace(/[,‏]/g, '') : 'N/A',
            'Unit Price (IQD)': item['Unit Price (IQD)'],
            'Total Number': item['Total Number'],
            'Base Total Price (IQD)': item['Base Total Price (IQD)'],
            'Total Price (IQD)': item['Total Price (IQD)'],
            '30% Price (IQD)': item['30% Price (IQD)']
          });
        }
      });

      const wsSheet3 = XLSX.utils.json_to_sheet(sheet3Data);

      // Create workbook
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Completed Requests');
      XLSX.utils.book_append_sheet(wb, wsSummary, 'Machine Summary');
      XLSX.utils.book_append_sheet(wb, wsSheet3, 'Comparison Sheet3');

      // Download the file
      XLSX.writeFile(wb, 'completed_requests.xlsx');
    }

    // Function to generate PDF for all completed requests (matching final.html style)
    async function generateAllPDF() {
      const printBtn = document.getElementById('printAllBtn');
      const originalText = printBtn.textContent;
      printBtn.textContent = 'Generating PDF...';
      printBtn.disabled = true;

      const completedRequests = getCompletedRequests();
      if (completedRequests.length === 0) {
        alert('No completed requests to print.');
        printBtn.textContent = originalText;
        printBtn.disabled = false;
        return;
      }

      // Load Excel data for pricing calculations
      let excelData = [];
      try {
        const response = await fetch('database.xlsx');
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
        excelData = jsonData.slice(1).filter(row => row.length >= 4);
      } catch (error) {
        console.error('Error loading Excel file:', error);
        // Continue without Excel data
      }

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight() - 30; // Leave space for header

      for (let i = 0; i < completedRequests.length; i++) {
        const request = completedRequests[i];

        // Create a temporary div to render the request details (matching final.html style)
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = generateRequestDetailHTML(request, excelData);
        tempDiv.style.position = 'absolute';
        tempDiv.style.left = '-9999px';
        tempDiv.style.top = '-9999px';
        tempDiv.style.width = '794px'; // A4 width at 96dpi
        tempDiv.style.background = 'white';
        tempDiv.style.padding = '15px';
        tempDiv.style.boxSizing = 'border-box';
        document.body.appendChild(tempDiv);

        try {
          // Wait for content to render
          await new Promise(resolve => setTimeout(resolve, 500));

          // Use html2canvas to capture the request details (matching final.html)
          const canvas = await html2canvas(tempDiv, {
            scale: 2,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#ffffff'
          });

          const imgData = canvas.toDataURL('image/png');
          const imgProps = pdf.getImageProperties(imgData);
          const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

          // Add a new page for each request (except the first)
          if (i > 0) {
            pdf.addPage();
          }

          // Add Asiacell Logistic Service logo at the top (matching final.html)
          pdf.setFontSize(20);
          pdf.setFont(undefined, 'bold');
          pdf.setTextColor(220, 53, 69); // Red color matching the theme
          pdf.text('ASIACELL', pdfWidth / 2, 15, { align: 'center' });

          pdf.setFontSize(16);
          pdf.setFont(undefined, 'normal');
          pdf.setTextColor(73, 80, 87); // Dark gray color
          pdf.text('LOGISTIC SERVICE', pdfWidth / 2, 22, { align: 'center' });

          // Add a separator line
          pdf.setDrawColor(220, 53, 69); // Red color
          pdf.setLineWidth(0.5);
          pdf.line(20, 25, pdfWidth - 20, 25);

          // Scale the image to fit the page height if necessary
          let finalWidth = pdfWidth;
          let finalHeight = pdfHeight;
          if (pdfHeight > pageHeight) {
            const scale = pageHeight / pdfHeight;
            finalWidth = pdfWidth * scale;
            finalHeight = pageHeight;
          }

          // Center the image horizontally
          const xOffset = (pdfWidth - finalWidth) / 2;

          // Add image to PDF below the logo
          pdf.addImage(imgData, 'PNG', xOffset, 30, finalWidth, finalHeight);

        } catch (error) {
          console.error('Error capturing request details:', error);
        } finally {
          // Remove the temporary div
          if (document.body.contains(tempDiv)) {
            document.body.removeChild(tempDiv);
          }
        }
      }

      // Get current date for filename
      const timestamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      const filename = `All_Completed_Requests_${timestamp}.pdf`;

      try {
        // Save the PDF
        pdf.save(filename);
      } catch (error) {
        console.error('Error saving PDF:', error);
        alert('Error saving PDF. Please try again.');
      }

      // Restore button state
      printBtn.textContent = originalText;
      printBtn.disabled = false;
    }

      const approvals = generateApprovalLoop(request);

      // Helper function to get approval date
      function getApprovalDate(roleKey, status) {
        const dateKey = `${roleKey}_date_${request.id}`;
        let storedDate = localStorage.getItem(dateKey);

        if (!storedDate && (status === 'Approved' || status === 'Submitted')) {
          // If no date stored but approved or submitted, store current date and use it
          storedDate = new Date().toISOString();
          localStorage.setItem(dateKey, storedDate);
        }

        if (storedDate) {
          return new Date(storedDate).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'

        return '';

          date = getApprovalDate(roleKey, approval.status);

              <tr>
                <td style="border: 1px solid #dee2e6; padding: 4px; font-size: 9px;">${approval.role}</td>
                <td style="border: 1px solid #dee2e6; padding: 4px; text-align: center; font-size: 9px; color: ${color}; font-weight: 600;">${approval.status}</td>
                <td style="border: 1px solid #dee2e6; padding: 4px; text-align: center; font-size: 9px;">${approverText}</td>
                <td style="border: 1px solid #dee2e6; padding: 4px; text-align: center; font-size: 9px;">${dateText}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;

      // Add logistic officer name at the end
      const logisticFooter = `
        <div style="margin-top: 15px; padding: 10px; background: #e8f5e8; border-radius: 4px; border-left: 3px solid #28a745; text-align: center; font-weight: bold; color: #155724;">
          logistic control : ${logisticOfficer}
        </div>
      `;

      return approvalHTML + logisticFooter;
    }

    // Function to generate approval loop for a request (same as final.html)
    function generateApprovalLoop(request) {
      const requestData = request;
      const machineData = request.machineData || {};
      const logisticData = request.logisticData || {};

      const approvals = [];

      // If the request is completed (has logistic data), set approvals based on request type
      if (logisticData && logisticData.logisticOfficer) {
        const isTransit = requestData.isTransit;
        const needsStoreKeeper = requestData.warehouseOfficerNeeded;

      approvals.push({ role: 'requester', status: 'Submitted', approver: requestData.requesterName });

          if (isTransit) {
            approvals.push({ role: 'requester manager', status: 'Not Required', approver: '' });
            approvals.push({ role: 'Logistic Supervisor', status: 'Approved', approver: getUsernameForRole('logistic-control') });
          approvals.push({ role: 'Work Completion Approval (manager)', status: 'Not Required', approver: '' });
          approvals.push({ role: 'W.H Approval', status: needsStoreKeeper ? 'Approved' : 'Not Required', approver: needsStoreKeeper ? requestData.storeKeeperApprover || getUsernameForRole('store-keeper') : '' });
          const logisticApprover = request.id === 'SR-7479' ? getUsernameForRole('request-viewer') : (logisticData.logisticOfficer || 'request-viewer user');
          approvals.push({ role: 'logistic officer', status: 'Approved', approver: logisticApprover });
        } else {
          approvals.push({ role: 'requester manager', status: 'Approved', approver: requestData.chiefName });
          approvals.push({ role: 'Logistic Supervisor', status: 'Approved', approver: getUsernameForRole('logistic-control') });
          approvals.push({ role: 'Work Completion Approval (manager)', status: 'Approved', approver: requestData.chiefName });
          approvals.push({ role: 'W.H Approval', status: needsStoreKeeper ? 'Approved' : 'Not Required', approver: needsStoreKeeper ? requestData.storeKeeperApprover || getUsernameForRole('store-keeper') : '' });
          const logisticApprover = request.id === 'SR-7479' ? getUsernameForRole('request-viewer') : (logisticData.logisticOfficer || 'request-viewer user');
          approvals.push({ role: 'logistic officer', status: 'Approved', approver: logisticApprover });
        }
      } else {
        // Check individual approval statuses
        // Chief Approval
        const chiefApproved = localStorage.getItem(`approved_chief_approval_${request.id}`);
        const chiefRejected = localStorage.getItem(`rejected_chief_approval_${request.id}`);
        const chiefPending = localStorage.getItem(`pending_chief_approval_${request.id}`);

        if (chiefApproved) {
          approvals.push({ role: 'requester manager', status: 'Approved' });
        } else if (chiefRejected) {
          approvals.push({ role: 'requester manager', status: 'Rejected' });
        } else if (chiefPending) {
          approvals.push({ role: 'requester manager', status: 'Pending' });
        } else {
          approvals.push({ role: 'requester manager', status: 'Not Started' });
        }

        // Logistic Supervisor
        if (machineData && (machineData.status === 'work_approved' || machineData.status === 'completion_approved')) {
          approvals.push({ role: 'Logistic Supervisor', status: 'Approved', approver: localStorage.getItem('username') });
        } else {
          approvals.push({ role: 'Logistic Supervisor', status: 'Not Started', approver: '' });
        }

        // Work Completion Approval (manager)
        const completionApproved = localStorage.getItem(`approved_chief_completion_approval_${request.id}`);
        const completionRejected = localStorage.getItem(`rejected_chief_completion_approval_${request.id}`);
        const completionPending = localStorage.getItem(`pending_chief_completion_approval_${request.id}`);

        if (completionApproved) {
          approvals.push({ role: 'Work Completion Approval (manager)', status: 'Approved' });
        } else if (completionRejected) {
          approvals.push({ role: 'Work Completion Approval (manager)', status: 'Rejected' });
        } else if (completionPending) {
          approvals.push({ role: 'Work Completion Approval (manager)', status: 'Pending' });
        } else {
          approvals.push({ role: 'Work Completion Approval (manager)', status: 'Not Started' });
        }

        // Store Keeper Approval
        const storeKeeperPending = localStorage.getItem(`pending_store_keeper_approval_${request.id}`);
        const storeKeeperApproved = localStorage.getItem(`approved_store_keeper_approval_${request.id}`);

        if (storeKeeperApproved) {
          approvals.push({ role: 'W.H Approval', status: 'Approved' });
        } else if (storeKeeperPending) {
          approvals.push({ role: 'W.H Approval', status: 'Pending' });
        } else {
          approvals.push({ role: 'W.H Approval', status: 'Not Started' });
        }

        // Logistic Approval
        if (logisticData && logisticData.logisticOfficer) {
          approvals.push({ role: 'logistic officer', status: 'Approved' });
        } else {
          approvals.push({ role: 'logistic officer', status: 'Not Started' });
        }
      }

      return approvals;
    }

    // Function to export selected requests to Excel
    async function exportSelectedToExcel() {
      if (selectedRequests.size === 0) {
        alert('No requests selected for export.');
        return;
      }

      const allCompletedRequests = getCompletedRequests();
      const selectedRequestsData = allCompletedRequests.filter(request =>
        selectedRequests.has(request.id)
      );

      if (selectedRequestsData.length === 0) {
        alert('No valid requests found for export.');
        return;
      }

      // Load Excel data for pricing
      let excelData = [];
      try {
        const response = await fetch('database.xlsx');
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
        excelData = jsonData.slice(1).filter(row => row.length >= 4);
        console.log('Excel data loaded for selected export:', excelData.length, 'rows');
      } catch (error) {
        console.error('Error loading Excel file:', error);
        alert('Error loading pricing data from database.xlsx');
        return;
      }

      // Prepare data for Excel - flatten machines into separate rows
      const data = [];
      let grandTotal = 0;

      selectedRequestsData.forEach(request => {
        const requestTotal = { machines: 0, totalPrice: 0 };
        const machines = request.logisticData.machines || [];

        console.log('DEBUG: Processing selected request:', request.srNumber);
        console.log('DEBUG: Machines data:', machines);

        if (machines && machines.length > 0) {
          machines.forEach((machine, index) => {
            console.log('DEBUG: Processing machine:', machine);

            // Ensure machine data has the correct structure
            const machineType = machine.machine || machine.type || 'unknown';
            const machineCount = parseInt(machine.count || machine.quantity || 1);
            const machineDays = parseInt(machine.days || machine.duration || 1);

            // Calculate price based on machine, location, and work type combination from Excel data
            let unitPrice = 0;
            if (machine.machine && machine.location && machine.workType) {
              const matchingRow = excelData.find(row =>
                row[0] && row[0].toString().trim() === machine.machine &&
                row[1] && row[1].toString().trim() === machine.location &&
                row[2] && row[2].toString().trim() === machine.workType &&
                row[3]
              );
              if (matchingRow && matchingRow[3]) {
                unitPrice = parseInt(matchingRow[3].toString().replace(/[,‏]/g, '')) || 0;
                console.log('Found matching row for:', machine.machine, machine.location, machine.workType, 'Price:', unitPrice);
              } else {
                console.log('No matching row found for:', machine.machine, machine.location, machine.workType);
              }
            } else {
              console.log('Missing data for machine:', machine.machine, 'location:', machine.location, 'workType:', machine.workType);
            }

            const multiplier = machine.multiplier || 1;
            const baseMachineTotal = unitPrice * machineDays * machineCount;
            const machineTotal = baseMachineTotal * multiplier;

            console.log('DEBUG: Machine details:', {
              originalMachine: machine,
              type: machineType,
              count: machineCount,
              days: machineDays,
              unitPrice: unitPrice,
              multiplier: multiplier,
              baseTotal: baseMachineTotal,
              total: machineTotal,
              availableExcelData: excelData.length
            });

            requestTotal.totalPrice += machineTotal;
            requestTotal.machines += 1;

            const rowData = {
              'SR Number': request.srNumber || 'N/A',
              'Department': request.department || 'N/A',
              'Requester': request.requesterName || 'N/A',
              'Manager': request.chiefName || 'N/A',
              'Request Date': request.requestDate ? new Date(request.requestDate).toLocaleDateString('en-US') : 'N/A',
              'Completed Date': request.logisticData.completeWorkDate ? new Date(request.logisticData.completeWorkDate).toLocaleDateString('en-US') : 'N/A',
              'Logistic Officer': request.logisticData.logisticOfficer || 'N/A',
              'Transit': request.isTransit ? 'Yes' : 'No',
              'Machine': machineType,
              'Location': machine.location || 'N/A',
              'Work Type': machine.workType || 'N/A',
              'Number': machineCount,
              'Days': machineDays,
              'Unit Price (IQD)': unitPrice,
              'Base Total (IQD)': baseMachineTotal,
              'Total Price (IQD)': machineTotal
            };

            // Add 30% indicator if multiplier > 1
            if (multiplier > 1) {
              rowData['30% Applied'] = 'Yes';
            }
            rowData['30% Price (IQD)'] = multiplier > 1 ? baseMachineTotal * 0.3 : 0;

            data.push(rowData);
          });
        } else {
          // If no machines, add a row without machine details
          console.log('DEBUG: No machines found for selected request:', request.srNumber);
          data.push({
            'SR Number': request.srNumber || 'N/A',
            'Department': request.department || 'N/A',
            'Requester': request.requesterName || 'N/A',
            'Manager': request.chiefName || 'N/A',
            'Request Date': request.requestDate ? new Date(request.requestDate).toLocaleDateString('en-US') : 'N/A',
            'Completed Date': request.logisticData.completeWorkDate ? new Date(request.logisticData.completeWorkDate).toLocaleDateString('en-US') : 'N/A',
            'Logistic Officer': request.logisticData.logisticOfficer || 'N/A',
            'Transit': request.isTransit ? 'Yes' : 'No',
            'Machine': 'No machines',
            'Location': 'N/A',
            'Work Type': 'N/A',
            'Number': 0,
            'Days': 0,
            'Unit Price (IQD)': 0,
            'Total Price (IQD)': 0
          });
        }

        grandTotal += requestTotal.totalPrice;
      });

      // Sort data by SR Number for merging
      data.sort((a, b) => (a['SR Number'] || '').localeCompare(b['SR Number'] || ''));

      // Create worksheet
      const ws = XLSX.utils.json_to_sheet(data);

      // Add merges for SR Number column where consecutive rows have the same SR
      const merges = [];
      let startRow = 1; // Start from row 1 (0-indexed, but Excel rows start at 1, header is 0)
      for (let i = 1; i < data.length; i++) {
        if (data[i]['SR Number'] !== data[i - 1]['SR Number']) {
          if (startRow < i) {
            merges.push({ s: { r: startRow, c: 0 }, e: { r: i, c: 0 } }); // Merge column A (0) from startRow to i
          }
          startRow = i + 1;
        }
      }
      // Last group
      if (startRow < data.length) {
        merges.push({ s: { r: startRow, c: 0 }, e: { r: data.length, c: 0 } });
      }

      ws['!merges'] = merges;

      // Create summary data for machine counts and pricing
      const machineSummary = {};
      data.forEach(row => {
        const machine = row['Machine'];
        const location = row['Location'];
        const workType = row['Work Type'];
        const count = row['Number'] || 0;
        const days = row['Days'] || 0;
        const unitPrice = row['Unit Price (IQD)'] || 0;
        const baseTotal = row['Base Total (IQD)'] || 0;
        const totalPrice = row['Total Price (IQD)'] || 0;
        const thirtyPercentPrice = row['30% Price (IQD)'] || 0;

        if (machine && machine !== 'No machines') {
          const key = `${machine}|${location}|${workType}`;
          if (!machineSummary[key]) {
            machineSummary[key] = {
              totalCount: 0,
              unitPrice: unitPrice,
              baseTotalPrice: 0,
              totalPrice: 0,
              total30Percent: 0
            };
          }
          // total number is number * days
          machineSummary[key].totalCount += count * days;
          machineSummary[key].baseTotalPrice += baseTotal;
          machineSummary[key].totalPrice += totalPrice;
          machineSummary[key].total30Percent += thirtyPercentPrice;
        }
      });

      const summaryData = Object.keys(machineSummary).map(key => {
        const [machine, location, workType] = key.split('|');
        const summary = machineSummary[key];
        return {
          'Machine': machine,
          'Location': location,
          'Work Type': workType,
          'Unit Price (IQD)': summary.unitPrice,
          'Total Number': summary.totalCount,
          'Base Total Price (IQD)': summary.baseTotalPrice,
          'Total Price (IQD)': summary.totalPrice,
          '30% Price (IQD)': summary.total30Percent
        };
      });

      // Create summary worksheet
      const wsSummary = XLSX.utils.json_to_sheet(summaryData);

      // Create Sheet3: Comparison with database.xlsx
      const sheet3Data = [];
      summaryData.forEach(item => {
        const machine = item['Machine'];
        const location = item['Location'];
        const workType = item['Work Type'];
        const matchingDbRow = excelData.find(row =>
          row[0] && row[0].toString().trim() === machine &&
          row[1] && row[1].toString().trim() === location &&
          row[2] && row[2].toString().trim() === workType
        );
        if (matchingDbRow && matchingDbRow.length > 4) {
          sheet3Data.push({
            'des': matchingDbRow[4] ? matchingDbRow[4].toString().replace(/[,‏]/g, '') : 'N/A',
            'Unit Price (IQD)': item['Unit Price (IQD)'],
            'Total Number': item['Total Number'],
            'Base Total Price (IQD)': item['Base Total Price (IQD)'],
            'Total Price (IQD)': item['Total Price (IQD)'],
            '30% Price (IQD)': item['30% Price (IQD)']
          });
        }
      });

      const wsSheet3 = XLSX.utils.json_to_sheet(sheet3Data);

      // Create workbook
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Selected Requests');
      XLSX.utils.book_append_sheet(wb, wsSummary, 'Machine Summary');
      XLSX.utils.book_append_sheet(wb, wsSheet3, 'Comparison Sheet3');

      // Download the file with selected count in filename
      const filename = `selected_requests_${selectedRequestsData.length}_items.xlsx`;
      XLSX.writeFile(wb, filename);
    }

    // Initialize the page
    document.addEventListener('DOMContentLoaded', () => {
      renderCompletedRequests('');

      // Add search functionality
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', function() {
        renderCompletedRequests(this.value.trim());
      });

      // Add export functionality
      const exportBtn = document.getElementById('exportBtn');
      exportBtn.addEventListener('click', exportToExcel);

      // Add print functionality
      const printAllBtn = document.getElementById('printAllBtn');
      printAllBtn.addEventListener('click', generateAllPDF);

      // Add selection functionality
      const selectAllBtn = document.getElementById('selectAllBtn');
      const clearSelectionBtn = document.getElementById('clearSelectionBtn');
      const exportSelectedBtn = document.getElementById('exportSelectedBtn');

      selectAllBtn.addEventListener('click', selectAllRequests);
      clearSelectionBtn.addEventListener('click', clearAllSelections);
      exportSelectedBtn.addEventListener('click', exportSelectedToExcel);

      // Initialize button states
      updateSelectionButtons();

      // Update local storage data every 3 seconds
      // Removed setInterval to prevent automatic refresh
      // setInterval(() => {
      //   renderCompletedRequests('');
      // }, 3000);
    });
  </script>
